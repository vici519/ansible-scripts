- name: Настройка firewall на серверах
  hosts: all
  become: yes  # Выполнять от имени root
  
  tasks:
    - name: Добавляем IP в зону 3proxy
      ansible.builtin.raw: /usr/bin/firewall-cmd --zone=3proxy --add-source=5.45.74.76 --permanent
      changed_when: true

    - name: Перезагружаем firewall
      ansible.builtin.raw: /usr/bin/firewall-cmd --reload
      changed_when: true
